# Single source of truth for the paper list.
# The research page (_generated/research-list.md) and /llms.txt are BOTH
# generated from this file by scripts/build-agent-files.R, which runs
# automatically on `quarto render`. Edit here, never in research.qmd.
#
# Fields:
#   slug        - stable id; if paper_md is true, papers/<slug>/paper.md must exist
#   section     - working-papers | in-progress | publications
#   jmp         - true marks the job market paper (gets its own llms.txt section)
#   status      - plain-text status, e.g. "Revise & resubmit"
#   venue       - journal name (styled on the research page, plain in llms.txt)
#   pdf / url   - site-relative PDF path, or external canonical URL
#   ssrn / code - optional extra links
#   llms_summary- 1-2 line description used in llms.txt (omit rather than guess)
#   abstract    - full abstract, shown in the research page <details> toggle

papers:
  - slug: visibility-and-retail-demand
    title: "Visibility and Retail Demand: Evidence from Bike Share"
    section: working-papers
    coauthors:
      - name: Avi Goldfarb
        url: https://www.avigoldfarb.com/
    status: "Revise & resubmit"
    venue: "Marketing Science"
    award: "Awarded best in track, Evidence from the Field — Marketing Science Conference 2025"
    pdf: pdf/visibility_and_retail_demand.pdf
    ssrn: https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5749902
    paper_md: true
    llms_summary: >-
      Links the staggered expansion of bike-share networks in New York City and
      Boston to high-frequency cellphone mobility data on 1,000+ retailers.
      Only storefronts with line-of-sight visibility from new stations gain
      store visits — visibility, not proximity, drives retail traffic.
    abstract: |
      Storefronts are central to how retailers convert passerby traffic into
      customers, yet rigorous evidence on the role of a storefront remains
      limited. Instead, retail models tend to emphasize proximity to consumers
      as a predictor of retail traffic and sales. We examine the role of
      storefront visibility, rather than location per se, in driving retail
      traffic by linking the staggered expansion of shared bike networks in New
      York City and Boston with high-frequency cellphone mobility data on more
      than 1000 retailers. New bike share stations create a plausibly exogenous
      surge in passerby traffic. Using exact bike share station locations, we
      measure line-of-sight observability between stations and storefronts. Our
      results show that only visible retailers experience significant gains in
      store visits after the opening of a bike share station. Storefront
      features like informative signage and legible fonts further amplify these
      effects. These findings highlight the marketing communications role of
      storefront visibility.


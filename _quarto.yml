project:
  type: website
  resources:
    - pdf/
  
execute:
  freeze: auto  # re-render only when source changes

website:
  title: "Jordan Hutchings"
  favicon: "img/favicon2.png"
  site-url: "https://www.jordanhutchings.com"
  description: "Jordan Hutchings is a Quantitative Marketing Ph.D. candidate at the University of Toronto studying causal inference, industrial organization, and retailing."
  image: "img/jhutchings-avatar.png"
  open-graph: true
  twitter-card:
    card-style: summary
  google-analytics: 
    cookie-consent: true
    tracking-id: "G-QH21BBYP6K"
    anonymize-ip: true
  navbar:
    title: Jordan Hutchings
    left:
      - href: blog.qmd
        text: Blog
      - href: research.qmd
        text: Research
      - href: pdf/cv.pdf
        text: CV
      # - href: misc.qmd
      #   text: Misc
    right:
      - icon: github
        href: https://github.com/jjhutchi
format:
  html:
    theme: 
      light: [sandstone, _light.scss]
      dark: [sandstone, _dark.scss]
    css: styles.css
    include-in-header:
      - text: |
          <meta name="description" content="Jordan Hutchings is a Quantitative Marketing Ph.D. candidate at the University of Toronto studying causal inference, industrial organization, and retailing.">
    editor: source